# One Airzone zone, included from airzone.yaml with: vars: {zone: N, name: "..."}
# Each zone is its own device in Home Assistant (an ESPHome sub-device of the ATOM), like with the Pi's bridge:
# its entities are simply "Marche", "Température", "Humidité", and the device can be put in its own room.
esphome:
  devices:
    - id: zone${zone}
      name: ${name}
      relation: child   # zone of the same Airzone system (ESPHome 2026.11+: required, via|child)

climate:
  - platform: airzone
    zone: ${zone}
    name: None   # the thermostat takes the zone's name
    device_id: zone${zone}

sensor:
  - platform: template
    name: Température
    device_id: zone${zone}
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 30s
    lambda: return id(az).value(${zone} * 256 + 8, 0.1, -20, 60);
  - platform: template
    name: Humidité
    device_id: zone${zone}
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(az).value(${zone} * 256 + 0x1F, 1, 0, 100);

# Plain on/off of the zone, in the current system mode (for a simple toggle on the dashboard)
switch:
  - platform: template
    name: Marche
    device_id: zone${zone}
    icon: mdi:power
    restore_mode: DISABLED   # never act at boot: the state is read from the bus
    lambda: return id(az).flag(${zone} * 256, 0x0004);
    turn_on_action:
      - lambda: id(az).zone_power(${zone}, true);
    turn_off_action:
      - lambda: id(az).zone_power(${zone}, false);
