# One Airzone zone, included from airzone.yaml with: vars: {zone: N, name: "..."}
climate:
  - platform: airzone
    zone: ${zone}
    name: ${name}

sensor:
  - platform: template
    name: ${name} température
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 30s
    lambda: return id(az).value(${zone} * 256 + 8, 0.1, -20, 60);
  - platform: template
    name: ${name} humidité
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(az).value(${zone} * 256 + 0x1F, 1, 0, 100);

# Plain on/off of the zone, in the current system mode (for a simple toggle on the dashboard)
switch:
  - platform: template
    name: ${name} marche
    icon: mdi:power
    restore_mode: DISABLED   # never act at boot: the state is read from the bus
    lambda: return id(az).flag(${zone} * 256, 0x0004);
    turn_on_action:
      - lambda: id(az).zone_power(${zone}, true);
    turn_off_action:
      - lambda: id(az).zone_power(${zone}, false);
